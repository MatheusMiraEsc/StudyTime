<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if materia %}Editar{% else %}Criar{% endif %} Matéria</title>
</head>
<body>
    <h1>{% if materia %}Editar{% else %}Criar{% endif %} Matéria</h1>

    <form method="post">
        {% csrf_token %}
        <label for="nome_materia">Nome:</label>
        <input type="text" id="nome_materia" name="nome_materia" value="{{ materia.nome_materia|default:'' }}"><br><br>

        <label for="assuntos">Assuntos:</label>
        <textarea id="assuntos" name="assuntos">{{ materia.assuntos|default:'' }}</textarea><br><br>

        <button type="submit">Salvar</button>
    </form>

    <br>
    <a href="{% url 'listar_materias' %}">Voltar para lista</a>
</body>
</html>
